version: '3.8'

services:
  cloud_server_1:
    build:
      context: ./servers
      dockerfile: Dockerfile
    container_name: cloud_server_1
    environment:
      - SERVER_NAME=Cloud Server 1
      - SERVER_ID=1
      - PORT=5000
    ports:
      - "5001:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cloud_network

  cloud_server_2:
    build:
      context: ./servers
      dockerfile: Dockerfile
    container_name: cloud_server_2
    environment:
      - SERVER_NAME=Cloud Server 2
      - SERVER_ID=2
      - PORT=5000
    ports:
      - "5002:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cloud_network

  cloud_server_3:
    build:
      context: ./servers
      dockerfile: Dockerfile
    container_name: cloud_server_3
    environment:
      - SERVER_NAME=Cloud Server 3
      - SERVER_ID=3
      - PORT=5000
    ports:
      - "5003:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cloud_network

networks:
  cloud_network:
    driver: bridge
